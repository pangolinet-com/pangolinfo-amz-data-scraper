identity:
  author: "pangolinfo"
  name: "pangolinfo"
  label:
    en_US: "Pangolinfo Amazon Data Scraper"
    zh_Hans: "Pangolinfo Amazon Data Scraper"
  description:
    en_US: A powerful e-commerce data extraction tool that effortlessly scrapes real-time Amazon product details,
      keyword rankings, and BSR top lists into structured JSON for your AI agents.
    zh_Hans: 一款强大的电商数据抓取插件，帮助 AI 应用轻松绕过反爬机制，抓取实时的亚马逊商品详情、关键词排名及热销榜单等结构化数据。
  icon: "icon.svg"

credentials_for_provider:
  api_key:
    type: "secret-input"
    required: true
    placeholder:
      en_US: "Please input your Pangolin API key"
      zh_Hans: "请输入您的 Pangolin API 密钥"
    help:
      en_US: "Get your Pangolin API key from your Pangolin account settings."
      zh_Hans: "从您的 Pangolin 账户设置中获取 Pangolin API 密钥。"
    label:
      en_US: "Pangolin API Key"
      zh_Hans: "Pangolin API 密钥"

tools:
  - tools/scrape_product_seller.yaml
  - tools/scrape_keyword.yaml
  - tools/scrape_best_sellers.yaml
  - tools/scrape_product_detail.yaml
  - tools/scrape_follow_sellers.yaml
  - tools/scrape_new_releases.yaml
  - tools/scrape_product_category.yaml
extra:
  python:
    source: provider/pangolinfo.py
